name: Probe7

on:
  workflow_dispatch:

jobs:
  binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
          run_install: false

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: web
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run build

      - name: Resolve version metadata
        id: meta
        shell: bash
        run: |
          version="dev"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          ldflags="-s -w \
            -X github.com/subflow-org/subflow/internal/version.Version=${{ steps.meta.outputs.version }} \
            -X github.com/subflow-org/subflow/internal/version.Commit=${{ steps.meta.outputs.commit }} \
            -X github.com/subflow-org/subflow/internal/version.BuildTime=${{ steps.meta.outputs.build_time }}"
          mkdir -p dist
          go build -trimpath -ldflags "$ldflags" \
            -o "dist/subflow-${{ matrix.goos }}-${{ matrix.goarch }}${ext}" .

      - name: Package archive
        shell: bash
        run: |
          name="subflow-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd dist && zip -q "${name}.zip" "${name}.exe")
          else
            (cd dist && tar -czf "${name}.tar.gz" "${name}")
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: subflow-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
