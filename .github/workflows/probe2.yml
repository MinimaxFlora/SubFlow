name: Probe2

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version string to stamp into the binary (defaults to the tag)
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
    steps:
      - name: Resolve version metadata
        id: meta
        shell: bash
        run: |
          echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

  release:
    name: Publish release
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Generate checksums
        shell: bash
        run: echo done
